# =====================================================
# Publish to GitHub Pages, only after the suite has passed on main
# =====================================================
# The same rule as `npm run deploy` and its gate (scripts/check-ci-green.mjs):
# nothing is published that CI has not passed. This job does not run the suite
# itself; it waits for the `tests` workflow to finish on main and publishes
# exactly the commit that workflow tested, and only if it succeeded.
#
# The built app is pushed to the `gh-pages` branch, which is what
# `npm run deploy` has always published to, and GitHub serves that branch at
# https://<owner>.github.io/<repository>/ (the `base` in vite.config.ts).
# GitHub turns Pages on by itself when that branch first appears; if it does
# not, set Settings > Pages > Source to "Deploy from a branch", gh-pages, root.
#
# "Run workflow" (workflow_dispatch) publishes main by hand, without waiting
# for a tests run. Use it only for a commit you know is green.
# =====================================================

name: pages

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vite build
      # The same publish `npm run deploy` does (gh-pages -d dist --dotfiles),
      # pushed with this workflow's own token.
      - name: Push dist to gh-pages
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish $SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
